{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-9"><div class="card shadow-sm"><div class="card-header"><h4 class="mb-0">New Opportunity</h4></div><div class="card-body"><form method="post" class="row g-3"><div class="col-md-8"><label>Opportunity Name *</label><input class="form-control" name="opportunity_name" required></div><div class="col-md-4"><label>Stage</label><select class="form-select" name="stage">{% for s in stages %}<option>{{ s }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Customer</label><select class="form-select" name="customer_id"><option value="">-- none --</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.customer_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Lead</label><select class="form-select" name="lead_id"><option value="">-- none --</option>{% for l in leads %}<option value="{{ l.id }}">{{ l.lead_name }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Amount *</label><input class="form-control" name="amount" type="number" min="0.01" step="0.01" required></div><div class="col-md-4"><label>Probability % *</label><input class="form-control" name="probability" type="number" min="0" max="100" required></div><div class="col-md-4"><label>Expected Close Date *</label><input class="form-control" name="expected_close_date" type="date" min="{{ today }}" required></div><div class="col-md-6"><label>Assigned To</label><select class="form-select" name="assigned_to">{% for u in users %}<option value="{{ u.id }}">{{ u.name }} — {{ u.role }}</option>{% endfor %}</select></div><div class="col-12"><label>Notes</label><textarea class="form-control" name="notes"></textarea></div><div class="col-12"><button class="btn btn-primary">Save Opportunity</button> <a class="btn btn-light" href="{{ url_for('opportunities') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header"><h4 class="mb-0">New Customer</h4></div><div class="card-body"><form method="post" class="row g-3" onsubmit="return validatePhoneEmail(this)"><div class="col-md-6"><label>Customer Name *</label><input class="form-control" name="customer_name" required maxlength="120"></div><div class="col-md-6"><label>Company *</label><input class="form-control" name="company_name" required></div><div class="col-md-6"><label>Email *</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label>Phone *</label><input class="form-control" name="phone" required pattern="[0-9]{10}"></div><div class="col-md-6"><label>City</label><input class="form-control" name="city"></div><div class="col-md-6"><label>State</label><input class="form-control" name="state"></div><div class="col-12"><label>Address</label><textarea class="form-control" name="address"></textarea></div><div class="col-md-6"><label>Status</label><select class="form-select" name="status"><option>Active</option><option>Inactive</option></select></div><div class="col-12"><button class="btn btn-primary">Save Customer</button> <a class="btn btn-light" href="{{ url_for('customers') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}

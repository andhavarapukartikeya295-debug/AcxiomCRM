{% extends 'auth_base.html' %}{% block content %}<h4 class="mb-3">Register</h4><form method="post"><div class="mb-3"><label>Name</label><input class="form-control" name="name" required maxlength="100"></div><div class="mb-3"><label>Email</label><input class="form-control" name="email" type="email" required></div><div class="mb-3"><label>Password</label><input class="form-control" name="password" type="password" minlength="8" required></div><button class="btn btn-primary w-100">Register</button></form><div class="text-center mt-3"><a href="{{ url_for('login') }}">Back to login</a></div>{% endblock %}

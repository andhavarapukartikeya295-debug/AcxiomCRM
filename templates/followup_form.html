{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header"><h4 class="mb-0">Schedule Follow-Up</h4></div><div class="card-body"><form method="post" class="row g-3"><div class="col-md-6"><label>Date *</label><input class="form-control" type="date" name="follow_up_date" min="{{ today }}" required></div><div class="col-md-6"><label>Type</label><select class="form-select" name="follow_up_type">{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div><div class="col-12"><label>Subject *</label><input class="form-control" name="subject" required maxlength="150"></div><div class="col-md-6"><label>Customer</label><select class="form-select" name="customer_id"><option value="">-- none --</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.customer_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Lead</label><select class="form-select" name="lead_id"><option value="">-- none --</option>{% for l in leads %}<option value="{{ l.id }}">{{ l.lead_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Assigned To</label><select class="form-select" name="assigned_to">{% for u in users %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}</select></div><div class="col-12"><label>Remarks</label><textarea class="form-control" name="remarks"></textarea></div><div><button class="btn btn-primary">Schedule</button> <a class="btn btn-light" href="{{ url_for('followups') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}

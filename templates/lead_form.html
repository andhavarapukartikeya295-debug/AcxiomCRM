{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-9"><div class="card shadow-sm"><div class="card-header"><h4 class="mb-0">New Lead</h4></div><div class="card-body"><form method="post" class="row g-3" onsubmit="return validatePhoneEmail(this)"><div class="col-md-6"><label>Lead Name *</label><input class="form-control" name="lead_name" required maxlength="120"></div><div class="col-md-6"><label>Company</label><input class="form-control" name="company_name"></div><div class="col-md-6"><label>Email *</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label>Phone *</label><input class="form-control" name="phone" required pattern="[0-9]{10}"></div><div class="col-md-4"><label>Source</label><select class="form-select" name="source">{% for s in sources %}<option>{{ s }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Status</label><select class="form-select" name="status">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Priority</label><select class="form-select" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="col-md-6"><label>Expected Value</label><input class="form-control" name="expected_value" type="number" min="0" step="0.01" value="0"></div><div class="col-md-6"><label>Assigned To</label><select class="form-select" name="assigned_to">{% for u in users %}<option value="{{ u.id }}">{{ u.name }} — {{ u.role }}</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Save Lead</button> <a class="btn btn-light" href="{{ url_for('leads') }}">Cancel</a></div></form></div></div></div></div>{% endblock %}
